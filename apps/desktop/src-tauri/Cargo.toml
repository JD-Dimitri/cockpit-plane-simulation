[package]
name = "a350-simulator"
version = "0.1.0"
description = "Simulateur pédagogique de type A350 (outil non certifié)"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "a350_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
